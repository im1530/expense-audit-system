# ============================================================================
# AI Agent 财务报销审核系统 —— Nginx 生产配置样例
#
# 职责：
#   1. 托管前端构建产物（frontend/dist），SPA 路由回退到 index.html；
#   2. 把 /api/ 反向代理到后端（uvicorn），透传真实客户端 IP，供限流与审计使用；
#   3. 开启 gzip 与静态资源长缓存，index.html 不缓存，保证发版立即生效。
#
# 放置位置：
#   Windows  D:\nginx\conf\conf.d\expense-audit.conf   （在 nginx.conf 的 http 块内 include conf.d/*.conf;）
#   Linux    /etc/nginx/conf.d/expense-audit.conf
#
# 需要按实际情况修改的 4 处，均已用 TODO 标注：
#   server_name（= ALLOWED_HOSTS）、证书路径、前端 dist 根目录、后端地址
# ============================================================================

# 后端上游：uvicorn 单实例；多实例时在这里加 server 行并启用 least_conn
upstream expense_audit_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    # server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;   # 第二个实例（多进程部署时）
    keepalive 32;
}

# HTTP 一律跳 HTTPS（证书就绪后可启用）
server {
    listen 80;
    server_name expense.example.com;        # TODO: 换成你的域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name expense.example.com;        # TODO: 与后端 ALLOWED_HOSTS 完全一致，否则会被 TrustedHost 拦成 400

    # TODO: 证书路径（Windows 用 D:/nginx/cert/...，Linux 用 /etc/letsencrypt/live/...）
    ssl_certificate     D:/nginx/cert/expense.example.com.pem;
    ssl_certificate_key D:/nginx/cert/expense.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # TODO: 前端构建产物目录（npm run build 生成的 dist）
    root  D:/sites/expense-audit/dist;
    index index.html;

    # 上传上限：后端 MAX_UPLOAD_MB=9.9，这里留 2MB 余量给 multipart 边界
    client_max_body_size 12m;

    # 基础安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # gzip：Vite 产物未压缩（本项目 minify 关闭），压缩交给 Nginx
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    access_log  logs/expense-audit.access.log;
    error_log   logs/expense-audit.error.log warn;

    # ---------- 静态资源 ----------
    # 带内容 hash 的文件可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口文件不缓存：发版后用户刷新即拿到新版本
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ---------- 后端接口 ----------
    location /api/ {
        proxy_pass http://expense_audit_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 关键：透传真实 IP 与协议，限流按真实 IP、审计日志记录真实来源
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 预审、凭证识别、Excel 导出可能较慢，超时要放宽
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # 上传/下载走流式，不在 Nginx 落临时文件
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # 探活：不打访问日志，避免刷盘
    location = /health {
        proxy_pass http://expense_audit_backend/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # 接口文档：默认只允许内网访问（上线要求）
    location /api/docs {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://expense_audit_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- 前端路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件一律拒绝
    location ~ /\. {
        deny all;
    }
}
